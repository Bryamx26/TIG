# compose.yaml


services:
  influxdb2:
    image: influxdb:2
    ports:
      - "8086:8086"   # port pc gauche = port hote ; port pc droite = port container
    environment:   # variables d'environnement
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${PASSWORD}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${TOKEN_INFLUXDB}
      DOCKER_INFLUXDB_INIT_ORG: ${ORGANISATION}
      DOCKER_INFLUXDB_INIT_BUCKET: ${BUCKET}
    volumes:
      - influxdb2-data:/var/lib/influxdb2
      - influxdb2-config:/etc/influxdb2
    networks:
      - app_tig

  telegraf:
    container_name: telegraf_tig
    image: telegraf:1.29
   
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro  
      - /proc:/host/proc:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/user/1000/docker.sock:/var/run/docker.sock
      - /sys:/host/sys:ro
      - /dev:/host/dev:ro
    environment:
      BUCKET: ${BUCKET}
      ORGANISATION: ${ORGANISATION}
      TOKEN_INFLUXDB: ${TOKEN_INFLUXDB}
    networks:
      - app_tig
    depends_on:
      - influxdb2

  grafana:
    container_name: grafana_tig
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    networks:
      - app_tig
    depends_on:
      - influxdb2

volumes:
  influxdb2-data:
  influxdb2-config:

networks:  # creation d'un reseau prive entre les containers
  app_tig:
